services:
  build-uboot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: armbian-build-uboot
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - armbian-cache:/workspace/cache
      - /dev:/dev
    environment:
      - FORCE_CHECKOUT=no
      # - SKIP_BUILD=1
      # - REMOTE_HOST=192.168.128.15
    command: ["/bin/bash", "userpatches/build-deploy-uboot.sh"]

  build-dtb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: armbian-build-dtb
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - armbian-cache:/workspace/cache
      - /dev:/dev
    environment:
      - FORCE_CHECKOUT=no
      # - SKIP_BUILD=1
      # - REMOTE_HOST=192.168.128.115
    command: ["/bin/bash", "userpatches/build-deploy-dtb.sh"]

  build-image:
    profiles: ["image"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: armbian-build-image
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - armbian-cache:/workspace/cache
      - /dev:/dev
    environment:
      - FORCE_CHECKOUT=no
      - ALLOW_ROOT=yes
      - PRE_PREPARED_HOST=yes
      - PESTER_TERMINAL=no
      - WT_SESSION=1
    command:
      - ./compile.sh 
      - build
      - BOARD=pbstvstick
      - BRANCH=current
      - BUILD_DESKTOP=no
      - BUILD_MINIMAL=yes
      - KERNEL_BTF=no
      - KERNEL_CONFIGURE=no
      - RELEASE=trixie
      - KERNEL_GIT=shallow
      - EXTRAWIFI=no

  # Prueba de reinicios del stick (no arranca con "docker compose up"; ver reboot-stick.sh)
  #   docker compose run --rm -e MODE=sysrq -e COUNT=10 reboot-stick
  reboot-stick:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - .:/workspace
    environment:
      - MODE=reboot
      - COUNT=20
      # - PAUSE=120
      # - REMOTE_HOST=192.168.128.15
    command: ["/bin/bash", "userpatches/reboot-stick.sh"]

volumes:
  armbian-cache: