name: Build PBSTVStick Image

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to build (all = parallel kernel and full image, kernel = only kernel/dtb, image = only full image)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - kernel
          - image
          - uboot

  push:

jobs:
  build-uboot:
    name: Build U-Boot
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'uboot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
  
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
  
      - name: Build U-Boot
        run: |
          sudo ./compile.sh uboot \
            BOARD=pbstvstick \
            BRANCH=current \
            KERNEL_GIT=shallow
  
      - name: Upload U-Boot Artifact
        uses: actions/upload-artifact@v7
        with:
          name: armbian-pbstvstick-uboot
          path: |
            output/debs/linux-u-boot-*.deb
            output/debug/uboot/*
          retention-days: 7

  build-kernel:
    name: Build Kernel & DTB
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'kernel' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Build Kernel
        run: |
          sudo ./compile.sh kernel \
            BOARD=pbstvstick \
            BRANCH=current \
            KERNEL_GIT=shallow \
            KERNEL_CONFIGURE=no

      - name: Upload Kernel & DTB Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: armbian-pbstvstick-kernel-dtb
          path: |
            output/debs/linux-image-*.deb
            output/debs/linux-dtb-*.deb
          retention-days: 7

  build-image:
    name: Build Full Image (Trixie)
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'image' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Inject private credentials into customize-image.sh
        run: |
          sed -i "s/REPLACE_WITH_SSID/${{ secrets.WIFI_SSID }}/g" userpatches/customize-image.sh
          sed -i "s/REPLACE_WITH_KEY/${{ secrets.WIFI_KEY }}/g" userpatches/customize-image.sh
          sed -i "s/REPLACE_WITH_ROOT_PW/${{ secrets.ROOT_PASSWORD }}/g" userpatches/customize-image.sh

      - name: Build Armbian Image
        run: |
          sudo ./compile.sh build \
            BOARD=pbstvstick \
            BRANCH=current \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_BTF=no \
            KERNEL_CONFIGURE=no \
            RELEASE=trixie \
            KERNEL_GIT=shallow \
            EXTRAWIFI=yes

      - name: Upload Full Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: armbian-pbstvstick-trixie
          path: |
            output/images/*
          retention-days: 7



